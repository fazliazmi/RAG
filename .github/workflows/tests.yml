name: tests

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install (same pinned versions as the README)
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -e . --no-deps
          python -m pip check

      - name: Lint
        run: ruff check src tests

      # Unit tests only: they use fakes and an in-memory Qdrant, so no Ollama,
      # Docker or internet is needed. Integration tests (-m integration) need the
      # real services and run locally.
      - name: Unit tests
        run: pytest -q
