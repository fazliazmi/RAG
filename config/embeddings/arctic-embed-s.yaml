# Snowflake arctic-embed-s: 33M parameters, 384 dimensions. A middle ground:
# about 4-5x faster than nomic-embed-text on a CPU (~19 CVEs/s on an 8-core laptop).
# Pull it with:  ollama pull snowflake-arctic-embed:33m
provider: ollama
model: snowflake-arctic-embed:33m
base_url: http://127.0.0.1:11434
max_chars: 2000
doc_prefix: ""
query_prefix: "Represent this sentence for searching relevant passages: "
