# Evaluation set for `cyberrag eval`. A question passes retrieval if any ID in
# `expected` is in the retrieved context, and passes citation if the answer
# mentions one. `requires` skips the question when that index is missing.

# ---- CWE (works after: cyberrag fetch cwe && cyberrag index cwe) ----
- question: How can I prevent SQL injection in my web application?
  expected: [CWE-89]
  requires: cwe
- question: What is CWE-79 and what are its consequences?
  expected: [CWE-79]
  requires: cwe
- question: What is the difference between stored and reflected cross-site scripting?
  expected: [CWE-79]
  requires: cwe
- question: Which weakness lets attackers read files outside the intended folder using ../ sequences?
  expected: [CWE-22, CWE-23]
  requires: cwe
- question: What is a use-after-free bug and how is it detected?
  expected: [CWE-416]
  requires: cwe
- question: How do I mitigate OS command injection?
  expected: [CWE-78, CWE-77]
  requires: cwe
- question: What is an out-of-bounds write?
  expected: [CWE-787]
  requires: cwe
- question: How is cross-site request forgery prevented?
  expected: [CWE-352]
  requires: cwe
- question: Why is deserialization of untrusted data dangerous?
  expected: [CWE-502]
  requires: cwe
- question: What is server-side request forgery?
  expected: [CWE-918]
  requires: cwe
- question: What are the risks of hard-coded credentials in source code?
  expected: [CWE-798, CWE-259]
  requires: cwe
- question: What does CWE-287 describe?
  expected: [CWE-287]
  requires: cwe

