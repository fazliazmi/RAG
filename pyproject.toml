[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cyberrag"
version = "0.1.0"
description = "RAG over NVD CVE and MITRE CWE data with swappable LLMs, embedders and vector stores"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "httpx>=0.27",
  "tenacity>=8.2",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyyaml>=6.0",
  "qdrant-client>=1.16",
  "ollama>=0.4",
  "typer>=0.12",
  "rich>=13",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
openai = ["openai>=1.30"]
dev = ["pytest>=8", "respx>=0.21", "ruff>=0.5", "fastapi>=0.110"]

[project.scripts]
cyberrag = "cyberrag.cli:app"

[project.urls]
Repository = "https://github.com/fazliazmi/RAG"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a running Ollama and Qdrant with indexed data"]
addopts = "-m 'not integration'"
filterwarnings = ["ignore:Payload indexes have no effect in the local Qdrant"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
